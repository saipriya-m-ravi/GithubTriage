[project]
name = "githubtriage"
version = "0.1.0"
description = "An agentic GitHub issue triage assistant"
readme = "README.md"
authors = [
    { name = "Saipriya", email = "saipriya.tcr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
githubtriage = "githubtriage.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
